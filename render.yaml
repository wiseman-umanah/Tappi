# Render Blueprint for the Tappi API (Stellar testnet). Render → New → Blueprint → pick this repo.
# Render builds and runs it in the cloud; nothing is built on a dev machine.
# The app's EAS builds point at https://tappi-softpos-api.onrender.com (eas.json): if Render gives
# the service another address, put that one in eas.json BEFORE building the app.
services:
  - type: web
    name: tappi-softpos-api
    runtime: node
    # free: sleeps after ~15 min idle, and the first request after that takes ~1 min.
    # starter (~$7/month): always on. Change this one word when you want that.
    plan: free
    # Same region as the Postgres database (Oregon), so it can use the database's internal address.
    region: oregon
    # Exactly one instance: Stellar submissions and AI voice clips are kept in memory (server.mjs).
    numInstances: 1
    buildCommand: corepack enable && corepack prepare pnpm@12.15.0 --activate && pnpm install --frozen-lockfile && pnpm build:server
    startCommand: pnpm serve
    # 200 only when the database and the Stellar treasury are reachable.
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: EXPO_NO_TELEMETRY
        value: '1'
      # ─── Asked for when the Blueprint is created (sync: false = never stored in git) ───
      # Your Render Postgres: its "Internal Database URL" (database → Connect). Tables are created on start.
      - key: DATABASE_URL
        sync: false
      # From .env.local: pays fees, opens wallets, pays the welcome money.
      - key: TREASURY_SECRET
        sync: false
      # Tappi AI. INTRON_API_KEY is optional (African-language voices).
      - key: GROQ_API_KEY
        sync: false
      - key: INTRON_API_KEY
        sync: false
      # ─── Nothing to paste below ───
      - key: SESSION_SECRET
        generateValue: true
      # Encrypts every user's wallet key in the database. Render makes it once and keeps it:
      # changing or losing it makes every existing wallet unusable.
      - key: WALLET_ENCRYPTION_KEY
        generateValue: true
      - key: STELLAR_HORIZON_URL
        value: https://horizon-testnet.stellar.org
      - key: USDC_ISSUER
        value: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
      # Tappi's test-naira issuer (an address, not a secret).
      - key: NGN_ISSUER
        value: GC6KCVTERZX7EV2FURFSUD2T7CBE6HBEDIHJJUPM6VRR74ECRKKTNIK2
      - key: NGN_PER_USDC
        value: '1569'
